# An edge node: accepts tund clients and visitor traffic near its users and
# relays whatever it doesn't hold itself to the node that does. It runs no
# dashboard and no database; it uses the control node's Postgres.
#
#   cp .env.example .env   # same TUND_BASE_DOMAIN, TUND_DASHBOARD_HOST, TUND_SECRET,
#                          # TUND_INTERNAL_SECRET and DNS provider settings as the
#                          # control node, plus the variables below
#   docker compose -f docker-compose.edge.yml up -d
#
# Network requirements: 80/443 (+ the TCP tunnel range) public; the relay port
# (TUND_RELAY_ADDR, default 4443) and Postgres reachable between nodes only,
# ideally over a private network such as WireGuard.
services:
  server:
    image: chicor.ee/tund/server:${TUND_IMAGE_TAG:-latest}
    restart: unless-stopped
    network_mode: host
    environment:
      TUND_ROLE: edge
      TUND_NODE_NAME: ${TUND_NODE_NAME:?set TUND_NODE_NAME, e.g. ash-1}
      TUND_NODE_REGION: ${TUND_NODE_REGION:-}
      TUND_PUBLIC_IP: ${TUND_PUBLIC_IP:-}                 # published in DNS; empty = detected
      TUND_NODE_CAPACITY_MBPS: ${TUND_NODE_CAPACITY_MBPS:-0}  # uplink, for the Nodes overview
      TUND_RELAY_ADDR: ${TUND_RELAY_ADDR:-:4443}
      TUND_RELAY_URL: ${TUND_RELAY_URL:?set TUND_RELAY_URL, the host:port other nodes use to reach this relay}
      TUND_CERT_STORAGE: postgres
      TUND_DATABASE_URL: ${TUND_DATABASE_URL:?set TUND_DATABASE_URL to the control node database}
      TUND_BASE_DOMAIN: ${TUND_BASE_DOMAIN:?}
      TUND_DASHBOARD_HOST: ${TUND_DASHBOARD_HOST:-}
      TUND_SECRET: ${TUND_SECRET:?}
      TUND_INTERNAL_SECRET: ${TUND_INTERNAL_SECRET:?}
      TUND_INTERNAL_ADDR: 127.0.0.1:4040
      TUND_TLS_MODE: ${TUND_TLS_MODE:-acme}
      TUND_ACME_EMAIL: ${TUND_ACME_EMAIL:-}
      TUND_ACME_CA: ${TUND_ACME_CA:-}
      TUND_DNS_PROVIDER: ${TUND_DNS_PROVIDER:-}
      TUND_DNS_API_TOKEN: ${TUND_DNS_API_TOKEN:-}
      TUND_PUBLIC_SCHEME: ${TUND_PUBLIC_SCHEME:-}
      TUND_PUBLIC_PORT: ${TUND_PUBLIC_PORT:-}
      TUND_TCP_PORTS: ${TUND_TCP_PORTS:-}
      TUND_TCP_HOST: ${TUND_TCP_HOST:-}
      TUND_DOWNLOAD_BASE_URL: ${TUND_DOWNLOAD_BASE_URL:-}
      TUND_REDIRECT_HOSTS: ${TUND_REDIRECT_HOSTS:-}
      TUND_DEBUG: ${TUND_DEBUG:-}
      # Defaults for settings not saved under Admin → Settings: keep them equal
      # to the control node's, or accounts get different limits per node.
      TUND_MAX_TUNNELS_PER_USER: ${TUND_MAX_TUNNELS_PER_USER:-0}
      TUND_MAX_PINNED_PER_USER: ${TUND_MAX_PINNED_PER_USER:-0}
      TUND_MAX_DOMAINS_PER_USER: ${TUND_MAX_DOMAINS_PER_USER:-0}
      TUND_MAX_TEAMS_PER_USER: ${TUND_MAX_TEAMS_PER_USER:-3}
      TUND_CUSTOM_DOMAINS: ${TUND_CUSTOM_DOMAINS:-false}
      TUND_PASSTHROUGH: ${TUND_PASSTHROUGH:-false}
      TUND_AUTO_PIN: ${TUND_AUTO_PIN:-true}
      TUND_BROWSER_WARNING: ${TUND_BROWSER_WARNING:-false}
      TUND_ABUSE_CONTACT: ${TUND_ABUSE_CONTACT:-}
      TUND_CAPTURE_MAX_BODY: ${TUND_CAPTURE_MAX_BODY:-262144}
      TUND_RETENTION_DAYS: ${TUND_RETENTION_DAYS:-7}
      TUND_BANDWIDTH_KBPS: ${TUND_BANDWIDTH_KBPS:-0}
      TUND_TRANSFER_GB: ${TUND_TRANSFER_GB:-0}
      TUND_MAX_TUNNEL_LIFETIME: ${TUND_MAX_TUNNEL_LIFETIME:-0}
      TUND_UNTRUSTED_CUSTOM_DOMAINS: ${TUND_UNTRUSTED_CUSTOM_DOMAINS:-review}
      TUND_UNTRUSTED_TCP: ${TUND_UNTRUSTED_TCP:-true}
      TUND_UNTRUSTED_TLS: ${TUND_UNTRUSTED_TLS:-true}
      TUND_SAFE_BROWSING_API_KEY: ${TUND_SAFE_BROWSING_API_KEY:-}
      TZ: ${TZ:-UTC}
    volumes:
      - tund-data:/data

volumes:
  tund-data:
