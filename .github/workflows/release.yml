name: Release

# Tags v* publish client binaries (GitHub Release) and versioned images;
# pushes to main publish :main images. Images go to the Chicorée registry
# (chicor.ee/tund/server, chicor.ee/tund/dashboard). Jobs sign in with their
# GitHub OIDC token, so no secret is stored: the organization tund trusts this
# repository under Service accounts -> CI identities on chicor.ee.
on:
  push:
    branches: [main]
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write
  id-token: write

env:
  REGISTRY: chicor.ee
  ORG: tund
  # Server the clients talk to when nothing else is configured.
  DEFAULT_SERVER: https://tund.io

jobs:
  binaries:
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
      - name: Build
        run: |
          version="${GITHUB_REF_NAME#v}"
          mkdir -p dist
          for os in linux darwin windows; do for arch in amd64 arm64; do
            ext=""; [ "$os" = windows ] && ext=".exe"
            GOOS=$os GOARCH=$arch CGO_ENABLED=0 go build -trimpath \
              -ldflags "-s -w -X tund/internal/client.Version=$version -X tund/internal/client.DefaultServer=$DEFAULT_SERVER" \
              -o "dist/tund-$os-$arch$ext" ./cmd/tund
          done; done
          # The newest release for `tund update` and the server's update hint.
          echo "$version" > dist/version.txt
          cd dist && sha256sum tund-* > checksums.txt && cat checksums.txt
      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" dist/* --title "$GITHUB_REF_NAME" --generate-notes \
            || gh release upload "$GITHUB_REF_NAME" dist/* --clobber

  image:
    strategy:
      fail-fast: false
      matrix:
        component: [server, dashboard]
        platform: [linux/amd64, linux/arm64]
    # Native runners per architecture (much faster than QEMU for the Next.js build).
    runs-on: ${{ matrix.platform == 'linux/arm64' && 'ubuntu-24.04-arm' || 'ubuntu-24.04' }}
    steps:
      - uses: actions/checkout@v5
      - uses: gochicoree/chicoree/.github/actions/login@8bee198467b7e27d1eb86b11cca6eb174937408d # main
        with:
          registry-url: https://${{ env.REGISTRY }}
          organization: ${{ env.ORG }}
          ttl: "3600"
      - name: Names
        id: names
        run: |
          version="${GITHUB_REF_NAME#v}"; [ "${GITHUB_REF_TYPE}" = tag ] || version="main-${GITHUB_SHA::7}"
          platform="${{ matrix.platform }}"
          {
            echo "image=${REGISTRY}/${ORG}/${{ matrix.component }}"
            echo "context=${{ matrix.component == 'dashboard' && 'dashboard' || '.' }}"
            echo "arch=${platform#linux/}"
            echo "version=$version"
          } >> "$GITHUB_OUTPUT"
      - uses: docker/setup-buildx-action@v3
      - name: Build and push by digest
        id: build
        uses: docker/build-push-action@v6
        with:
          context: ${{ steps.names.outputs.context }}
          platforms: ${{ matrix.platform }}
          build-args: VERSION=${{ steps.names.outputs.version }}
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.description=tund ${{ matrix.component }}
          outputs: type=image,name=${{ steps.names.outputs.image }},push-by-digest=true,name-canonical=true,push=true
          cache-from: type=gha,scope=${{ matrix.component }}-${{ steps.names.outputs.arch }}
          cache-to: type=gha,mode=max,scope=${{ matrix.component }}-${{ steps.names.outputs.arch }}
      - name: Export digest
        run: |
          mkdir -p /tmp/digests
          touch "/tmp/digests/${DIGEST#sha256:}"
        env:
          DIGEST: ${{ steps.build.outputs.digest }}
      - uses: actions/upload-artifact@v4
        with:
          name: digests-${{ matrix.component }}-${{ steps.names.outputs.arch }}
          path: /tmp/digests/*
          retention-days: 1

  manifest:
    needs: image
    runs-on: ubuntu-24.04
    strategy:
      matrix:
        component: [server, dashboard]
    steps:
      - uses: actions/download-artifact@v5
        with:
          pattern: digests-${{ matrix.component }}-*
          path: /tmp/digests
          merge-multiple: true
      - uses: docker/setup-buildx-action@v3
      - uses: gochicoree/chicoree/.github/actions/login@8bee198467b7e27d1eb86b11cca6eb174937408d # main
        with:
          registry-url: https://${{ env.REGISTRY }}
          organization: ${{ env.ORG }}
      - name: Tags
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.ORG }}/${{ matrix.component }}
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=raw,value=latest,enable=${{ startsWith(github.ref, 'refs/tags/v') }}
            type=raw,value=main,enable=${{ github.ref == 'refs/heads/main' }}
            type=sha,prefix=main-,enable=${{ github.ref == 'refs/heads/main' }}
      - name: Create manifest list
        working-directory: /tmp/digests
        run: |
          image="${REGISTRY}/${ORG}/${{ matrix.component }}"
          # Word splitting is intended: one -t per tag, one argument per digest.
          # shellcheck disable=SC2046
          docker buildx imagetools create $(jq -cr '.tags | map("-t " + .) | join(" ")' <<< "$DOCKER_METADATA_OUTPUT_JSON") \
            $(printf "$image@sha256:%s " *)
          docker buildx imagetools inspect "$image:$(jq -r '.labels["org.opencontainers.image.version"]' <<< "$DOCKER_METADATA_OUTPUT_JSON")"
