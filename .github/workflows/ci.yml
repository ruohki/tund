name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  go:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
      - name: gofmt
        run: test -z "$(gofmt -l cmd internal)" || (gofmt -l cmd internal; exit 1)
      - run: go vet ./...
      - run: go test -race ./...
      - name: Cross-compile the client
        run: |
          for os in linux darwin windows; do for arch in amd64 arm64; do
            GOOS=$os GOARCH=$arch CGO_ENABLED=0 go build -o /dev/null ./cmd/tund
          done; done

  dashboard:
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: dashboard
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v4
        with:
          package_json_file: dashboard/package.json
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: dashboard/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
      # Generates the global route types (PageProps, RouteContext) tsc needs.
      - run: pnpm exec next typegen
      - run: pnpm lint
      - run: pnpm exec tsc --noEmit
      - run: pnpm build
